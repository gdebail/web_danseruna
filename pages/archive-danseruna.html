<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive Danseruna</title>
  <style>
    :root { --bg:#0a0a0a; --fg:#f4f4f4; --accent:#ffe94d; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at top,#1b1b1b 0%,#090909 45%,#050505 100%); color:var(--fg); font-family:Arial,sans-serif; }
    .wrap { width:min(1200px,94vw); margin:24px auto 48px; }
    h1 { margin:8px 0 20px; font-size:clamp(26px,4vw,46px); letter-spacing:.03em; }
    .sub { opacity:.8; margin-bottom:18px; }

    .carousel-shell { position:relative; }
    .carousel { display:flex; gap:18px; overflow:auto; scroll-snap-type:x mandatory; padding:8px 8px 18px; scrollbar-width:thin; }
    .card { flex:0 0 clamp(220px,26vw,320px); scroll-snap-align:start; background:#121212; border-radius:0; border:1px solid #2e2e2e; overflow:hidden; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease; }
    .card:hover { transform:translateY(-4px); box-shadow:0 14px 28px rgba(0,0,0,.35); }
    .card img { width:100%; height:430px; object-fit:contain; display:block; background:#0e0e0e; }
    .meta { padding:10px 12px 14px; }
    .meta b { color:var(--accent); font-size:12px; letter-spacing:.08em; }
    .meta div { margin-top:4px; font-size:15px; font-weight:700; }

    .nav { position:absolute; top:42%; transform:translateY(-50%); width:48px; height:48px; border-radius:50%; border:2px solid rgba(255,233,77,.75); background:rgba(0,0,0,.75); color:#ffe94d; font-size:28px; font-weight:700; cursor:pointer; z-index:3; }
    .nav.left { left:-24px; }
    .nav.right { right:-24px; }
    .nav svg { width:20px; height:20px; display:block; margin:auto; }

    .modal { position:fixed; inset:0; background:rgba(0,0,0,.72); backdrop-filter: blur(3px); display:none; align-items:center; justify-content:center; z-index:90; }
    .modal.open { display:flex; }
    .stage { position:relative; width:min(1100px,94vw); height:min(82vh,820px); border-radius:24px; overflow:hidden; background:#0a0a0a; border:1px solid #2d2d2d; }

    .collage { position:absolute; inset:0; }
    .tile { position:absolute; border-radius:18px; overflow:hidden; box-shadow:0 10px 24px rgba(0,0,0,.45); will-change: left, top, transform; }
    .tile { background:#050505; }
    .tile img { width:100%; height:100%; object-fit:contain; object-position:center; display:block; filter:saturate(1.05) contrast(1.02); }

    .hero { --nav-gutter:46px; --hero-ratio:0.925; position:absolute; right:18px; bottom:18px; width:calc(min(22vw,240px) + (var(--nav-gutter) * 2)); aspect-ratio:var(--hero-ratio); height:auto; border-radius:14px; overflow:visible; border:0; z-index:4; background:rgba(10,10,10,.48); box-shadow:0 16px 36px rgba(0,0,0,.35); transition: width .22s ease, right .22s ease, bottom .22s ease, transform .22s ease; cursor: zoom-in; }
    .hero .poster-shell { position:absolute; inset:0 var(--nav-gutter); border-radius:0; overflow:visible; background:transparent; box-shadow:none; }
    .hero img { width:100%; height:100%; object-fit:contain; object-position:center; display:block; }
    .hero .reduce-btn {
      position:absolute;
      top:10px;
      right:10px;
      border:2px solid rgba(255,233,77,.9);
      background:rgba(0,0,0,.82);
      color:#ffe94d;
      border-radius:999px;
      width:40px;
      height:40px;
      padding:0;
      display:none;
      place-items:center;
      font-size:0;
      font-weight:800;
      cursor:pointer;
      z-index:2;
    }
    .hero .zoom-nav-btn {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      border:2px solid rgba(255,233,77,.9);
      background:rgba(0,0,0,.82);
      color:#ffe94d;
      border-radius:999px;
      width:44px;
      height:44px;
      padding:0;
      display:grid;
      place-items:center;
      font-size:0;
      cursor:pointer;
      z-index:2;
    }
    .hero .zoom-nav-btn[hidden] { display:none !important; }
    .hero .zoom-nav-btn.prev { left:8px; }
    .hero .zoom-nav-btn.next { right:8px; }
    .hero .zoom-nav-btn svg { width:20px; height:20px; display:block; }
    .hero .reduce-btn svg {
      width:20px;
      height:20px;
      display:block;
      transform: translateY(1.5px);
    }
    .stage.poster-zoomed .hero { --nav-gutter:34px; right:50%; bottom:50%; transform:translate(50%,50%); width:min(calc(min(56vw,620px) + (var(--nav-gutter) * 2)), calc(100% - 20px)); max-height:min(88vh,900px); z-index:8; border-radius:14px; cursor: zoom-out; background:rgba(10,10,10,.48); box-shadow:0 16px 36px rgba(0,0,0,.35); }
    .stage.poster-zoomed .hero .reduce-btn { display:grid; }
    .hero-nav-wrap { display:none; }
    .stage.poster-zoomed .hero-nav-wrap { display:none; }
    .hero-nav-wrap { position:absolute; right:18px; bottom:18px; width:min(22vw,240px); height:min(46vh,360px); z-index:6; pointer-events:none; }
    .hero-nav {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:44px;
      height:44px;
      border-radius:50%;
      border:2px solid rgba(255,233,77,.75);
      background:rgba(0,0,0,.74);
      color:#ffe94d;
      font-size:28px;
      line-height:1;
      font-weight:700;
      cursor:pointer;
      pointer-events:auto;
      display:grid;
      place-items:center;
    }
    .hero-nav.prev { left:-22px; }
    .hero-nav.next { right:-18px; }
    .hero-nav svg { width:20px; height:20px; display:block; }

    .label { position:absolute; left:16px; top:14px; background:var(--accent); color:#121212; font-weight:800; padding:8px 12px; border-radius:999px; z-index:3; }
    .close {
      position:absolute;
      right:12px;
      top:10px;
      border:2px solid rgba(255,233,77,.9);
      background:rgba(0,0,0,.82);
      color:#ffe94d;
      border-radius:999px;
      width:40px;
      height:40px;
      padding:0;
      display:grid;
      place-items:center;
      font-weight:800;
      font-size:22px;
      line-height:1;
      cursor:pointer;
      z-index:3;
      box-shadow:0 8px 18px rgba(0,0,0,.35);
    }
    .close:hover { background:rgba(255,233,77,.12); }
    .close svg { width:18px; height:18px; display:block; }
    .edition-text { position:absolute; left:18px; right:44%; bottom:16px; z-index:4; color:#fff; font-size:14px; line-height:1.34; text-shadow:0 2px 8px rgba(0,0,0,.6); }
    .edition-text .line { display:inline-block; margin:0 10px 8px 0; padding:7px 11px; border-radius:999px; background:rgba(0,0,0,.44); border:1px solid rgba(255,255,255,.18); backdrop-filter: blur(2px); }

    @media (max-width:900px) {
      .nav { display:none; }
      .hero { --nav-gutter:40px; right:10px; bottom:10px; width:calc(min(42vw,180px) + (var(--nav-gutter) * 2)); }
      .stage.poster-zoomed .hero { --nav-gutter:30px; width:min(calc(min(86vw,520px) + (var(--nav-gutter) * 2)), calc(100% - 14px)); max-height:min(82vh,760px); }
      .hero-nav-wrap { right:10px; bottom:10px; width:min(42vw,180px); height:min(42vh,280px); }
      .hero-nav.prev { left:-20px; }
      .hero-nav.next { right:-16px; }
      .edition-text { left:12px; right:calc(min(42vw, 180px) + 38px); bottom:10px; font-size:12px; }
    }

    html.archive-direct body { background: transparent; }
    html.archive-direct .wrap { display: none; }
    html.archive-direct .modal { position: fixed; inset: 0; display: flex; background: transparent; backdrop-filter: none; }
    html.archive-direct .stage { width: 100vw; height: 100vh; max-width: none; max-height: none; border-radius: 0; border: 0; }
  </style>
  <script>
    if (new URLSearchParams(window.location.search).get('direct') === '1') {
      document.documentElement.classList.add('archive-direct');
    }
  </script>
</head>
<body>
  <div class="wrap">
    <h1>Archive Danseruna</h1>
    <div class="sub">Clique une affiche pour ouvrir une composition photo.</div>
    <div class="carousel-shell">
      <button class="nav left" id="leftBtn" aria-label="Précédent">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="carousel" id="carousel"></div>
      <button class="nav right" id="rightBtn" aria-label="Suivant">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="stage" id="stage">
      <button class="close" id="closeBtn" aria-label="Fermer">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M7 7l10 10M17 7l-10 10" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <div class="label" id="label"></div>
      <div class="edition-text" id="editionText"></div>
      <div class="collage" id="collage"></div>
      <div class="hero" id="hero"></div>
      <div class="hero-nav-wrap">
        <button class="hero-nav prev" id="modalPrevBtn" aria-label="Edition précédente">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="hero-nav next" id="modalNextBtn" aria-label="Edition suivante">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="../data/archive.editions.js"></script>
  <script>
const params = new URLSearchParams(window.location.search);
const directMode = params.get('direct') === '1';
const requestedEdition = Number(params.get('edition'));
const requestedEditionNum = Number.isFinite(requestedEdition) ? requestedEdition : null;

const carousel = document.getElementById('carousel');
const modal = document.getElementById('modal');
const collage = document.getElementById('collage');
const hero = document.getElementById('hero');
const stage = document.getElementById('stage');
const label = document.getElementById('label');
const editionText = document.getElementById('editionText');
const modalPrevBtn = document.getElementById('modalPrevBtn');
const modalNextBtn = document.getElementById('modalNextBtn');

let motionRaf = null;
let tileStates = [];
let currentEditionIndex = 0;
let editions = [];
let editionCopy = {};

async function loadArchiveData() {
  // file:// fallback (mobile/in-app browsers often block fetch on local JSON)
  if (window.DANSERUNA_ARCHIVE_DATA && Array.isArray(window.DANSERUNA_ARCHIVE_DATA.editions)) {
    const source = window.DANSERUNA_ARCHIVE_DATA.editions;
    editions = source.map((ed) => ({
      year: ed.year,
      edition: ed.edition,
      folder: ed.folder,
      title: ed.title || `Danseruna #${ed.edition} (${ed.year})`,
      poster: ed.poster || null,
      images: Array.isArray(ed.images) ? ed.images : [],
    }));
    editionCopy = {};
    source.forEach((ed) => {
      editionCopy[ed.folder] = Array.isArray(ed.credits) ? ed.credits : [];
    });
    return;
  }

  const response = await fetch('../data/archive.editions.json', { cache: 'no-store' });
  if (!response.ok) {
    throw new Error('Impossible de charger data/archive.editions.json');
  }

  const payload = await response.json();
  const source = Array.isArray(payload.editions) ? payload.editions : [];

  editions = source.map((ed) => ({
    year: ed.year,
    edition: ed.edition,
    folder: ed.folder,
    title: ed.title || `Danseruna #${ed.edition} (${ed.year})`,
    poster: ed.poster || null,
    images: Array.isArray(ed.images) ? ed.images : [],
  }));

  editionCopy = {};
  source.forEach((ed) => {
    editionCopy[ed.folder] = Array.isArray(ed.credits) ? ed.credits : [];
  });
}
function cardTemplate(ed) {
      const hasPoster = !!ed.poster;
      const count = ed.images.length;
      return `<article class="card" data-folder="${ed.folder}" ${hasPoster ? '' : 'style="opacity:.55;pointer-events:none"'}>
        ${hasPoster ? `<img src="${ed.poster}" alt="${ed.title}">` : `<div style="aspect-ratio:3/4;display:grid;place-items:center;background:#222">Pas d'image</div>`}
        <div class="meta"><b>${ed.year || ''}</b><div>${ed.title}</div><small>${count} photos</small></div>
      </article>`;
    }

    function renderCarousel() {
      carousel.innerHTML = editions.map(cardTemplate).join('');
      carousel.querySelectorAll('.card').forEach((card, idx) => {
        card.addEventListener('click', () => openComposition(editions[idx], idx));
      });
    }

    function rng(seed) {
      let t = seed + 0x6D2B79F5;
      return function() {
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function updateModalNav() {
      modalPrevBtn.style.display = currentEditionIndex <= 0 ? 'none' : 'grid';
      modalNextBtn.style.display = currentEditionIndex >= editions.length - 1 ? 'none' : 'grid';
    }

    function openComposition(ed, idx = 0) {
      currentEditionIndex = idx;
      if (motionRaf) cancelAnimationFrame(motionRaf);
      tileStates = [];
      label.textContent = ed.title;
      stage.classList.remove('poster-zoomed');
      const showPrev = idx > 0;
      const showNext = idx < editions.length - 1;
      hero.innerHTML = ed.poster ? `<div class="poster-shell"><img src="${ed.poster}" alt="${ed.title}"></div>
        <button class="reduce-btn" type="button" aria-label="Réduire"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="zoom-nav-btn prev" type="button" aria-label="Edition précédente" ${showPrev ? '' : 'hidden'}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="zoom-nav-btn next" type="button" aria-label="Edition suivante" ${showNext ? '' : 'hidden'}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : '';
      editionText.innerHTML = (editionCopy[ed.folder] || []).map((line) => `<span class="line">${line}</span>`).join('');
      collage.innerHTML = '';

      const photos = ed.images.filter((src) => /\.(jpg|jpeg|png|webp)$/i.test(src) && src !== ed.poster);
      const rand = rng((ed.edition || 1) * 997 + (ed.year || 0));
      const cW = (collage.clientWidth || 980);
      const cH = (collage.clientHeight || 640);
      const placed = [];
      const avoidPosterColumn = {
        x: Math.max(0, cW - Math.min(260, Math.floor(cW * 0.27)) - 14),
        y: Math.max(0, cH - Math.min(380, Math.floor(cH * 0.52)) - 14),
        w: Math.min(260, Math.floor(cW * 0.27)),
        h: Math.min(380, Math.floor(cH * 0.52))
      };

      photos.forEach((src, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        const w = 118 + Math.floor(rand() * 128);
        const h = 90 + Math.floor(rand() * 116);
        let x = 0;
        let y = 0;
        let found = false;
        for (let tries = 0; tries < 60; tries += 1) {
          x = Math.floor(rand() * Math.max(40, cW - w - 8));
          y = Math.floor(rand() * Math.max(40, cH - h - 8));
          const overlapX = x < avoidPosterColumn.x + avoidPosterColumn.w && x + w > avoidPosterColumn.x;
          const overlapY = y < avoidPosterColumn.y + avoidPosterColumn.h && y + h > avoidPosterColumn.y;
          if (overlapX && overlapY) continue;

          // Keep images more separated: reject strong overlaps with already placed tiles.
          const pad = 40;
          const tooMuchOverlap = placed.some((r) => {
            const ax1 = x - pad;
            const ay1 = y - pad;
            const ax2 = x + w + pad;
            const ay2 = y + h + pad;
            const bx1 = r.x;
            const by1 = r.y;
            const bx2 = r.x + r.w;
            const by2 = r.y + r.h;
            return ax1 < bx2 && ax2 > bx1 && ay1 < by2 && ay2 > by1;
          });
          if (tooMuchOverlap) continue;
          found = true;
          break;
        }
        if (!found) {
          // fallback: fill remaining free space with smaller tile
          const fw = Math.max(88, Math.floor(w * 0.70));
          const fh = Math.max(76, Math.floor(h * 0.70));
          x = Math.floor(rand() * Math.max(30, cW - fw - 8));
          y = Math.floor(rand() * Math.max(30, cH - fh - 8));
        }
        const rot = -10 + rand() * 20;
        const va = (rand() < 0.5 ? -1 : 1) * (0.02 + rand() * 0.05);
        const speed = 0.35 + rand() * 0.55;
        const op = 0.38 + rand() * 0.42;
        tile.style.cssText = `width:${w}px;height:${h}px;left:${x}px;top:${y}px;opacity:${op};z-index:${1 + (i % 2)};transform:rotate(${rot}deg);`;
        tile.innerHTML = `<img src="${src}" alt="photo archive">`;
        collage.appendChild(tile);
        placed.push({ x, y, w, h });
        const state = { el: tile, x, y, w, h, a: rot, va, speed, tx: x, ty: y };
        tileStates.push(state);

        const imgEl = tile.querySelector('img');
        if (imgEl) {
          imgEl.addEventListener('load', () => {
            const nw = imgEl.naturalWidth || 0;
            const nh = imgEl.naturalHeight || 0;
            if (!nw || !nh) return;
            const ratio = nw / nh;
            const area = state.w * state.h;
            let newW = state.w;
            let newH = state.h;

            // Fit tile geometry to real photo orientation to avoid portrait frame on landscape photo (and inverse).
            if (ratio >= 1.15) {
              newW = Math.sqrt(area * ratio);
              newH = newW / ratio;
            } else if (ratio <= 0.85) {
              newH = Math.sqrt(area / ratio);
              newW = newH * ratio;
            } else {
              const edge = Math.sqrt(area);
              newW = edge;
              newH = edge;
            }

            newW = Math.max(96, Math.min(280, newW));
            newH = Math.max(76, Math.min(280, newH));

            state.w = newW;
            state.h = newH;
            tile.style.width = `${newW}px`;
            tile.style.height = `${newH}px`;

            const maxX = Math.max(0, cW - newW - 8);
            const maxY = Math.max(0, cH - newH - 8);
            state.x = Math.min(maxX, Math.max(0, state.x));
            state.y = Math.min(maxY, Math.max(0, state.y));
            state.tx = Math.min(maxX, Math.max(0, state.tx));
            state.ty = Math.min(maxY, Math.max(0, state.ty));
            tile.style.left = `${state.x}px`;
            tile.style.top = `${state.y}px`;
          }, { once: true });
        }
      });

      function pickTarget(t) {
        for (let tries = 0; tries < 40; tries += 1) {
          const tx = Math.floor(rand() * Math.max(40, cW - t.w - 8));
          const ty = Math.floor(rand() * Math.max(40, cH - t.h - 8));
          const overlapX = tx < avoidPosterColumn.x + avoidPosterColumn.w && tx + t.w > avoidPosterColumn.x;
          const overlapY = ty < avoidPosterColumn.y + avoidPosterColumn.h && ty + t.h > avoidPosterColumn.y;
          // Soft avoidance only: allow slight overlap, avoid deep stay.
          if (overlapX && overlapY && tx < avoidPosterColumn.w * 0.75) continue;
          t.tx = tx;
          t.ty = ty;
          return;
        }
        t.tx = Math.floor(rand() * Math.max(40, cW - t.w - 8));
        t.ty = Math.floor(rand() * Math.max(40, cH - t.h - 8));
      }

      tileStates.forEach(pickTarget);

      function animateTiles() {
        if (!modal.classList.contains('open')) return;
        for (const t of tileStates) {
          const dx = t.tx - t.x;
          const dy = t.ty - t.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 10) {
            pickTarget(t);
          } else {
            const step = Math.min(t.speed, dist);
            t.x += (dx / dist) * step;
            t.y += (dy / dist) * step;
          }
          t.a += t.va;
          t.el.style.left = `${t.x}px`;
          t.el.style.top = `${t.y}px`;
          t.el.style.transform = `rotate(${t.a.toFixed(2)}deg)`;
        }
        motionRaf = requestAnimationFrame(animateTiles);
      }
      modal.classList.add('open');
      updateModalNav();
      motionRaf = requestAnimationFrame(animateTiles);
    }

    modalPrevBtn.addEventListener('click', () => {
      if (currentEditionIndex <= 0) return;
      const nextIndex = currentEditionIndex - 1;
      openComposition(editions[nextIndex], nextIndex);
    });
    modalNextBtn.addEventListener('click', () => {
      if (currentEditionIndex >= editions.length - 1) return;
      const nextIndex = currentEditionIndex + 1;
      openComposition(editions[nextIndex], nextIndex);
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      modal.classList.remove('open');
      if (motionRaf) cancelAnimationFrame(motionRaf);
      stage.classList.remove('poster-zoomed');
      if (directMode && window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'danseruna-archive-close' }, '*');
      }
    });
    modal.addEventListener('click', (e) => { if (e.target === modal) { modal.classList.remove('open'); if (motionRaf) cancelAnimationFrame(motionRaf); stage.classList.remove('poster-zoomed'); } });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { modal.classList.remove('open'); if (motionRaf) cancelAnimationFrame(motionRaf); stage.classList.remove('poster-zoomed'); } });

    hero.addEventListener('click', (e) => {
      if (!hero.querySelector('img')) return;
      if (e.target && e.target.closest && e.target.closest('.zoom-nav-btn.prev')) {
        e.preventDefault();
        e.stopPropagation();
        if (currentEditionIndex <= 0) return;
        const keepZoom = stage.classList.contains('poster-zoomed');
        const nextIndex = currentEditionIndex - 1;
        openComposition(editions[nextIndex], nextIndex);
        if (keepZoom) stage.classList.add('poster-zoomed');
        return;
      }
      if (e.target && e.target.closest && e.target.closest('.zoom-nav-btn.next')) {
        e.preventDefault();
        e.stopPropagation();
        if (currentEditionIndex >= editions.length - 1) return;
        const keepZoom = stage.classList.contains('poster-zoomed');
        const nextIndex = currentEditionIndex + 1;
        openComposition(editions[nextIndex], nextIndex);
        if (keepZoom) stage.classList.add('poster-zoomed');
        return;
      }
      if (e.target && e.target.closest && e.target.closest('.reduce-btn')) {
        stage.classList.remove('poster-zoomed');
        return;
      }
      if (stage.classList.contains('poster-zoomed')) {
        stage.classList.remove('poster-zoomed');
      } else {
        stage.classList.add('poster-zoomed');
      }
    });

    const by = () => Math.min(360, Math.floor(window.innerWidth * 0.65));
    document.getElementById('leftBtn').addEventListener('click', () => carousel.scrollBy({ left: -by(), behavior:'smooth' }));
    document.getElementById('rightBtn').addEventListener('click', () => carousel.scrollBy({ left: by(), behavior:'smooth' }));

    async function initArchivePage() {
      try {
        await loadArchiveData();
        renderCarousel();

        if (directMode && editions.length) {
          const idx = requestedEditionNum !== null
            ? Math.max(0, editions.findIndex((ed) => ed.edition === requestedEditionNum))
            : 0;
          const startIndex = idx < 0 ? 0 : idx;
          openComposition(editions[startIndex], startIndex);
        }
      } catch (error) {
        console.error(error);
        carousel.innerHTML = '<p style="color:#f66;padding:10px">Erreur de chargement des archives.</p>';
      }
    }

    initArchivePage();
  </script>
</body>
</html>
